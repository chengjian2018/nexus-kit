# ============================================================================
# local_config.yaml 模板 — 复制为 host/config/local_config.yaml 后按需修改
# ============================================================================
#
#   cp host/config/local_config.example.yaml host/config/local_config.yaml
#
# local_config.yaml 含密钥，已被 .gitignore 忽略、绝不入库；
# api key 推荐经环境变量注入（api_key_env），不要把明文 key 写进本文件。
#
# 三个 LLM 节点的分工（spec 2026-09-02）：
#   llm_providers  连接层：按 provider code 声明 api_base / api_key_env /
#                  timeout / max_retries（不含模型与生成参数）
#   llm_default    编排层：默认 LLM 选择（code + model + temperature /
#                  max_tokens / enable_thinking），三层合并的兜底层
#   pattern_llm    pattern 级覆盖：pattern_code -> {code/model/...}，可细化
#                  到 nodes，优先于 llm_default；空 dict = 全部回退

llm_providers:
  dashscope:
    # 任何 OpenAI 兼容端点（DashScope 兼容模式 / OpenAI / 本地 vLLM …）
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    # 实际 key 从该环境变量读取（export DASHSCOPE_API_KEY=sk-...）
    api_key_env: DASHSCOPE_API_KEY
    timeout: 60
    max_retries: 2
  zai:
    # GLM Coding Plan（OpenAI Chat Completion 协议端点；Coding Plan 套餐额度
    # 只在该端点可用，通用 …/api/paas/v4 走按量付费）
    api_base: https://open.bigmodel.cn/api/coding/paas/v4
    # 实际 key 从该环境变量读取（export ZAI_API_KEY=...）
    api_key_env: ZAI_API_KEY
    timeout: 60
    max_retries: 2

llm_default:
  code: dashscope       # 对应 llm_providers 的 key / 注册的 provider code（切 GLM: code: zai）
  model: qwen3.8-flash  # 按 DashScope 实际可用模型修改（zai: glm-5.3 / glm-5.3-flash）
  temperature: 0.7
  max_tokens: 2048
  enable_thinking: false

pattern_llm: {}
# 示例：某 pattern 用更强模型，其某个 node 再单独覆盖
# pattern_llm:
#   deep_research:
#     code: dashscope
#     model: qwen3.8-max
#     nodes:
#       synthesize:
#         temperature: 0.3

# ============================================================================
# MCP servers（可选；不配置则整条 MCP 链路为 no-op）
# ============================================================================
# 每个条目：server 名 → toolset 名 mcp-<server 名>（atoms/tools/mcp_tool.py
# 启动时读取并注册）。字段：
#   transport          stdio | sse | streamable_http
#   command/args/env   stdio 传输的子进程命令（stdio 必填 command）
#   url/headers        sse / streamable_http 传输的端点（必填 url）
#   tool_name_prefix   可选注册名前缀（防跨 server 撞名），默认保留原名
#
# 工具授权（deny-by-default，三层收口，均在 pattern 代码里声明）：
#   pattern.allow_toolset 引用 mcp-<server 名> 工具集（工具集级授权），
#   节点 node.use_tools 列出具体工具名（空 = 不能用任何工具）。
#   server 配置里的 allowed_patterns 键已废弃（注册期 ACL 已删除），
#   写了也不生效。

mcp_servers: {}
# 示例（stdio 子进程）：
# mcp_servers:
#   websearch:
#     transport: stdio
#     command: npx
#     args: ["-y", "@example/mcp-server"]
#     env:
#       EXAMPLE_API_KEY: "<your-key>"     # 建议改为 $VAR 展开或部署时注入
# 使用方（pattern 声明，非本文件）：
#   Pattern(..., allow_toolset=["mcp-websearch"], nodes=[
#       BaseNode(code="search", use_tools=["web_search"], ...)])
# 示例（远程 HTTP 端点——优先 streamable_http；旧 SSE 传输与 mcp sdk
# 2.2.0 组合存在 tools/call 写阻塞挂起问题，z.ai 等服务方以 /mcp 端点
# + Bearer 头的 streamable_http 为实测可用形态）：
#   remote_search:
#     transport: streamable_http
#     url: "https://<host>/api/mcp/web_search_prime/mcp"
#     headers:
#       Authorization: "Bearer <your-token>"

# ============================================================================
# 存储与压缩（可选，以下即默认值）
# ============================================================================

# 会话审计 SQLite（相对服务启动目录；建议写绝对路径避免随 CWD 漂移）
# session_db_path: data/dialogue.db
# 知识库 SQLite（customer_agent 等使用）
# knowledge_db_path: data/knowledge.db
# 会话历史压缩：估算 token 超过阈值触发摘要压缩（0 = 关闭）
# session_compress_token_threshold: 6000
# 压缩后保留的最近消息条数（含 tool 行）
# session_compress_retain_count: 12

# ============================================================================
# delegate_task 子代理护栏（可选，以下即默认值；atoms/tools/subagent_tool.py）
# ============================================================================
# 使用方式（pattern 声明，非本文件）：
#   Pattern(..., allow_toolset=["subagent", "knowledge"], nodes=[
#       BaseNode(code="main", use_tools=["delegate_task"], ...)])
#   子代理工具池 = allow_toolset 各工具集 − subagent 自身（防递归提权）。

# subagent_tool:
#   timeout_seconds: 120   # 子 ReAct 循环整体超时（args 只能调小）
#   max_rounds: 8          # 子循环轮次上限
#   max_result_chars: 8000 # 最终结论回填主上下文的截断长度

# ============================================================================
# run_workflow 六拓扑护栏（可选，以下即默认值；atoms/tools/workflow_tool.py）
# ============================================================================
# 使用方式（pattern 声明，非本文件）：
#   Pattern(..., allow_toolset=["workflow", "knowledge"], nodes=[
#       BaseNode(code="main", use_tools=["run_workflow"], ...)])
#   叶子工具池 = allow_toolset 各工具集 − subagent/workflow 自身（防递归）。

# workflow_tool:
#   timeout_seconds: 300   # 整趟 workflow（全部叶子+裁判）整体超时，args 只能调小
#   max_rounds: 8          # 每个叶子子循环的轮次上限
#   max_width: 8           # 并行宽度上限（subtasks/angles/候选数，对齐图级 fanout）
#   max_cycles: 3          # adversarial_verification 生成-审校循环上限
#   max_iterations: 5      # loop_until_done 迭代上限
#   max_result_chars: 8000 # 最终结论回填主上下文的截断长度
#   trace_cap: 32          # 返回 steps 列表的上限条数

# ============================================================================
# bash / run_python 护栏（可选，以下即默认值；atoms/tools/shell_tool.py）
# ============================================================================
# 使用方式（pattern 声明，非本文件）：
#   Pattern(..., allow_toolset=["shell", "filesystem"], nodes=[
#       BaseNode(code="main", use_tools=["bash", "run_python"], ...)])
# 高权限工具集：授权收口在 pattern.allow_toolset + node.use_tools（三层
# deny-by-default），本节只管资源护栏，不做命令黑名单 / 路径沙箱。

# shell_tool:
#   timeout_seconds: 60     # 单条命令/脚本超时（超时 SIGKILL 整个进程组），args 只能调小
#   max_output_chars: 20000 # stdout / stderr 各自的截断长度

# ============================================================================
# 文件工具护栏（可选，以下即默认值；atoms/tools/file_tool.py）
# ============================================================================
# 使用方式（pattern 声明，非本文件）：
#   Pattern(..., allow_toolset=["filesystem"], nodes=[
#       BaseNode(code="main", use_tools=["read_text", "write_text",
#               "edit_file", "list_dir", "search_files", "find_files"], ...)])

# file_tool:
#   max_read_chars: 50000    # read_text 单次内容截断长度
#   max_write_chars: 200000  # write_text 超过即拒绝（防上下文巨物写盘）
#   max_edit_chars: 200000   # edit_file 可编辑的文件大小上限
#   max_list_entries: 500    # list_dir 条目截断
#   max_matches: 100         # search_files 命中截断（args 只能调小）
#   max_find_results: 500    # find_files 返回条数截断（args 只能调小）

# ============================================================================
# 会话任务清单护栏（可选，以下即默认值；atoms/tools/task_list_tool.py）
# ============================================================================
# 使用方式（pattern 声明，非本文件）：
#   Pattern(..., allow_toolset=["tasks"], nodes=[
#       BaseNode(code="main", use_tools=["read_tasks", "write_tasks"], ...)])
#   清单按 session_id 隔离（内存态，重启清空），子代理与父会话共享。

# tasks_tool:
#   max_tasks: 50       # 单会话任务条数上限
#   max_task_chars: 500 # 单条任务描述长度上限（超限拒绝）

# ============================================================================
# cron 定时调度护栏（可选，以下即默认值；atoms/tools/_cron_core.py + cron_tool.py）
# ============================================================================
# 使用方式（pattern 声明，非本文件）：
#   Pattern(..., allow_toolset=["cron", "knowledge"], nodes=[
#       BaseNode(code="main", use_tools=["create_cron", "list_crons",
#               "update_cron", "delete_cron"], ...)])
#   作业权限 = 创建时刻 pattern 授权的冻结快照（自动剔除 subagent/
#   workflow/cron 编排工具集）；触发 = 授权池上的 delegate 式子代理执行。
#   作业持久化到 jobs_path，重启后继续；停机期间错过的触发不补跑。
#   环境变量 NEXUS_CRON_DISABLED=1 可整体停用（测试隔离用）。

# cron_tool:
#   max_jobs: 20                # 作业数上限
#   fire_timeout_seconds: 300   # 单次触发超时（create args 只能调小）
#   max_rounds: 8               # 触发子代理的轮次上限
#   history_cap: 10             # 每作业保留的历史条数
#   max_input_chars: 8000       # 作业任务描述长度上限
#   max_result_chars: 4000      # 单次触发结果截断长度
#   jobs_path: data/cron_jobs.json  # 持久化文件（相对启动目录）
#   tick_seconds: 20            # 调度循环拍长（分钟级 cron 足够）

# ============================================================================
# 工具执行前危险操作播报（可选，以下即默认值；atoms/hooks/tool_guard.py）
# ============================================================================
# 使用方式（pattern 级声明，谁授了 shell/filesystem 谁挂 guard）：
#   Pattern(..., plugins={"agent_hooks": "tool_guard"},
#           allow_toolset=["shell", "filesystem", ...], ...)
# v1 只播报不干预：规则命中 → 日志 + 内存 ledger；规则未命中高危但命令
# 带可疑信号（网络动词/管道/命令替换/隐匿编码）→ 旁路小模型判读
# （后台线程，绝不阻塞主循环）。subagent / workflow 运行期不校验
# （P4 hook 点不在子循环路径上，结构免检）。
# 环境变量 NEXUS_TOOL_GUARD_LLM_DISABLED=1 可单独停用 LLM 判读（测试隔离用）。

# tool_guard:
#   enabled: true               # 总开关（false = hook 直接返回）
#   llm_fallback: false         # 可疑但规则未定的调用是否送小模型判读
#                               # （默认关=opt-in：判读会把工具参数送外部模型）
#   llm_max_input_chars: 2000   # 送审参数 JSON 截断长度
#   llm_max_queue: 64           # 判读队列上限（满则丢弃新条）
#   llm_timeout_seconds: 15     # 单次判读超时
#   llm:                        # judge 模型覆盖（叠加在 ambient 连接之上，
#                               # 推荐指向便宜小模型；省略 = 用节点同款）
#     model: qwen-flash
#     max_tokens: 256
