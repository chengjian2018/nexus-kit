pattern: note_polish          # 必填，绑定 pattern code

llm:                          # pattern 级默认，全体节点继承
  temperature: 0.3
  max_tokens: 4000

loop:                         # pattern 级循环预算
  max_steps: 10               # 一轮评审+修订 = 2 步；语义闸门通常更早停下

config:                       # 自由 bag：executor 经 get_pattern_custom_config 读取
  workspace_root: data/note_polish   # 运行时产物根（gitignored）
  max_review_rounds: 3        # 代码默认 3；调整在此覆盖
